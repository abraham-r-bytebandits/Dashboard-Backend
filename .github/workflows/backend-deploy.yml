name: Deploy Backend (Build in GitHub)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Generate Prisma Client
      - name: Prisma generate
        run: npx prisma generate

      # 5. Build project
      - name: Build backend
        run: npm run build

      # 5.5. Get GitHub Runner IP
      - name: Get GitHub Runner IP
        id: ip
        run: echo "ipv4=$(curl -s https://api.ipify.org)" >> $GITHUB_OUTPUT

      # 5.6. Configure AWS credentials
      - name: Configure AWS Credentials
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

      # 5.7. Add Runner IP to EC2 Security Group
      - name: Add Runner IP to Security Group
        if: ${{ secrets.AWS_SG_ID != '' }}
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.AWS_SG_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32

      # 6. Copy files to EC2
      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "dist,package.json,package-lock.json,prisma"
          target: "/home/ec2-user/backend"

      # 7. SSH into EC2 and deploy
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd ~/backend

            echo "📦 Installing production dependencies..."
            npm ci --omit=dev

            echo "⚙️ Running Prisma migrations..."
            npx prisma migrate deploy

            echo "🔁 Restarting PM2..."
            pm2 describe backend > /dev/null \
              && pm2 restart backend \
              || pm2 start dist/server.js --name backend

            pm2 save

            echo "✅ Deployment successful!"

      # 8. Remove Runner IP from Security Group
      - name: Remove Runner IP from Security Group
        if: ${{ always() && secrets.AWS_SG_ID != '' }}
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.AWS_SG_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32